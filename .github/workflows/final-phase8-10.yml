name: Final Phase 8-10 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-final:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install backend test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run complete regression suite
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests backend/tests

      - name: Run final smoke verification
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/final_verification.py

  frontend-final:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build production dashboard
        run: npm run build

      - name: Validate Linux demo launcher syntax
        working-directory: ${{ github.workspace }}
        run: bash -n scripts/run_offline_demo.sh
